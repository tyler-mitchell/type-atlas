name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run lint
      - run: pnpm exec vp run check-types
      - if: github.event_name == 'pull_request'
        run: pnpm exec bumpy ci check --strict
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm exec vp pm audit -- --prod

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.20.0"
          - os: ubuntu-latest
            node: "24.18.0"
          - os: ubuntu-latest
            node: "26"
          - os: windows-latest
            node: "24.18.0"
          - os: macos-latest
            node: "24.18.0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # The retrieval tools shell out to uvx. Without uv they report it
      # missing and every answer that names the semantic index in its scope
      # line comes back shorter than the captured corpus.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run build
      - run: pnpm exec vp run test
      - if: matrix.node == '24.18.0'
        run: pnpm exec vp run check:distribution
